# Netlify configuration for the Skadi Cloud Gist archived static site.
#
# Deployment is handled automatically by the GitHub Actions workflow
# (.github/workflows/deploy-static-site.yml), which generates the static site
# and pushes it to Netlify via the Netlify CLI on every push to main.
#
# Required GitHub Actions secrets:
#   SQL_USER, SQL_PASSWORD, SQL_HOST, SQL_DB
#   STORAGE_KIND (directory | s3)
#   STORAGE_DIRECTORY  – local path (when STORAGE_KIND=directory)
#   S3_BUCKET_NAME, S3_REGION, S3_ENDPOINT, S3_ACCESS_KEY, S3_SECRET_KEY
#                      – S3 credentials (when STORAGE_KIND=s3)
#   NETLIFY_AUTH_TOKEN – personal access token from Netlify
#   NETLIFY_SITE_ID    – site API ID from Netlify site settings

[build]
  publish = "static-site/build/static-site"
  # Deployment is managed by the GitHub Actions workflow; no Netlify build command needed.
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/gist/:id"
  to = "/gist/:id/"
  status = 301
